spring:
  application:
    name: eco-impact-tracker

  main:
    banner-mode: off

  datasource:
    url: jdbc:postgresql://localhost:5432/eco_tracker
    username: raouldrg
    password: 
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  sql:
    init:
      mode: never

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# JWT Configuration
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 hours in milliseconds

# Application Configuration
app:
  seed:
    force: ${SEED_FORCE:false}
  devTools:
    enabled: ${DEV_TOOLS_ENABLED:true}

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    org.hibernate: ERROR
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    com.ecoimpact.tracker: INFO
